name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  templates:
    name: Validate CloudFormation templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: >
          cfn-lint --regions ap-south-1 us-east-1 --
          infrastructure/demo/baseline.yaml
          examples/pull-request-review/template.yaml
          infrastructure/platform/template.yaml
          scenarios/*/after.yaml
